# OSRM auto-hébergé — moteur de calcul d'itinéraires pour Casse-Noisette.
#
# Trois instances, une par mode de déplacement : OSRM ne sert qu'un profil à la
# fois. Chacune répond en quelques dizaines de millisecondes sur le LAN, ce qui
# rend le réordonnancement des panneaux instantané côté page publique.
#
# Les données sont préparées une fois par ./prepare.sh (voir README.md), puis
# ces conteneurs se contentent de les servir.
#
# Deux voies d'accès, aucune exposée sur Internet ni sur le LAN :
#
#  - réseau Docker partagé `osrm-net` : c'est par là que les applications
#    conteneurisées appellent OSRM, par nom de service (http://osrm-car:5000).
#    Un port publié sur 127.0.0.1 ne suffirait pas : un conteneur ne peut pas
#    joindre la loopback de l'hôte, et chaque projet a son propre réseau.
#    À créer une fois :  docker network create osrm-net
#
#  - ports 5100-5102 sur 127.0.0.1 : pour l'hôte lui-même, le healthcheck et
#    les tunnels SSH depuis un poste de dev.

services:
  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: osrm-car
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 600 /data/car/region.osrm
    volumes:
      - ./data:/data:ro
    ports:
      - '127.0.0.1:5100:5000'
    networks: [osrm-net]
    healthcheck:
      # /dev/tcp est une fonction de bash (present dans l'image), pas de sh.
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/5000']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  osrm-bike:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: osrm-bike
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 600 /data/bike/region.osrm
    volumes:
      - ./data:/data:ro
    ports:
      - '127.0.0.1:5101:5000'
    networks: [osrm-net]
    healthcheck:
      # /dev/tcp est une fonction de bash (present dans l'image), pas de sh.
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/5000']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: osrm-foot
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 600 /data/foot/region.osrm
    volumes:
      - ./data:/data:ro
    ports:
      - '127.0.0.1:5102:5000'
    networks: [osrm-net]
    healthcheck:
      # /dev/tcp est une fonction de bash (present dans l'image), pas de sh.
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/5000']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  osrm-net:
    external: true
