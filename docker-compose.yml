# Casse-Noisette — production (homelab). db (Postgres 16) + web (Next.js standalone).
# Exposé via le Cloudflare Tunnel existant : casse-noisette.aynn.fr -> http://localhost:3024
# Secrets dans /opt/casse-noisette-app/.env (hors Git).

services:
  db:
    image: postgres:16-alpine
    container_name: casse-noisette-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-casse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-casse_noisette}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 5434 (5432 = platinum, 5433 = sky-sitter). 127.0.0.1 only -> le runner CI migre.
    ports:
      - '127.0.0.1:5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-casse} -d ${POSTGRES_DB:-casse_noisette}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  web:
    image: casse-noisette:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: casse-noisette-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-casse}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}@db:5432/${POSTGRES_DB:-casse_noisette}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET requis (openssl rand -hex 32)}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://casse-noisette.aynn.fr}
      NODE_ENV: production
    ports:
      - '127.0.0.1:3024:3000'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - internal

volumes:
  pgdata:
    name: casse-noisette-pgdata

networks:
  internal:
    driver: bridge
