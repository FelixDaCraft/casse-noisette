server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le manifest doit être servi avec le bon type MIME (sinon avertissements navigateur)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Le service worker ne doit pas être mis en cache agressivement (sinon maj bloquées)
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
